<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spec execution dashboard</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --wash: #f0efec;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --other: #b5b3ac; --wait: #c3c2b7;
  --critical: #d03b3b; --warning: #fab219; --good: #0ca30c;
  --add-bg: #e5f3e8; --add-ink: #0b5e26; --del-bg: #fbe8e7; --del-ink: #9b2222;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --other: #6b6a65; --wait: #4a4a46;
    --add-bg: #11301c; --add-ink: #93dba9; --del-bg: #3a1716; --del-ink: #f2a7a5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: #383835;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --other: #6b6a65; --wait: #4a4a46;
  --add-bg: #11301c; --add-ink: #93dba9; --del-bg: #3a1716; --del-ink: #f2a7a5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.layout { max-width: 1480px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: 1fr; }
main { min-width: 0; padding: 24px 0 64px; }
section[id], header[id] { scroll-margin-top: 72px; }
nav.side { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--ring); margin: 0 -16px; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
nav.side .title { font-weight: 600; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
nav.side ol { display: none; list-style: none; margin: 0; padding: 0; }
nav.side select { flex: 1; min-width: 0; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 8px; font: inherit; }
nav.side a { display: flex; gap: 8px; align-items: baseline; color: var(--ink-2); text-decoration: none; padding: 6px 10px; border-radius: 8px; font-size: 13px; line-height: 1.3; }
nav.side a .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 14px; }
nav.side a:hover { background: var(--wash); color: var(--ink); }
nav.side a:focus-visible { outline: 2px solid var(--s1); outline-offset: 1px; }
nav.side a[aria-current="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--s1); }
@media (min-width: 1100px) {
  .layout { grid-template-columns: 210px minmax(0, 1fr); gap: 28px; }
  nav.side { top: 0; height: 100vh; overflow-y: auto; margin: 0; padding: 24px 0; border: 0; display: block; background: transparent; }
  nav.side .title { display: block; padding: 0 10px 10px; }
  nav.side ol { display: block; }
  nav.side select { display: none; }
  section[id], header[id] { scroll-margin-top: 16px; }
}
.ins-filter { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
.ins-filter button { background: var(--surface); color: var(--ink-2); border: 1px solid var(--ring); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
.ins-filter button[aria-pressed="true"] { color: var(--ink); border-color: var(--s1); box-shadow: inset 0 0 0 1px var(--s1); }
.topics { display: grid; gap: 12px; }
.topic { border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; background: var(--page); min-width: 0; scroll-margin-top: 72px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge.prio { border-color: var(--s4); color: var(--ink); }
.badge.prio::before { content: "★"; color: var(--s4); margin-right: 5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px; }
.tag { font-size: 11.5px; border-radius: 6px; padding: 1px 7px; background: var(--wash); color: var(--ink-2); }
.tag b { font-weight: 600; color: var(--ink); }
.blk { margin-top: 8px; border-top: 1px dashed var(--grid); padding-top: 6px; }
.blk > summary { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.blk p { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
.alts { display: grid; gap: 6px; margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
.alts li { border: 1px solid var(--grid); border-radius: 8px; padding: 6px 10px; min-width: 0; }
.alts li.rec { border-color: var(--s1); box-shadow: inset 3px 0 0 var(--s1); }
.alts .opt { font-weight: 600; }
.alts .opt em { font-style: normal; font-weight: 400; color: var(--s1); margin-left: 6px; font-size: 12px; }
.alts dl { margin-top: 4px; }
pre.diff { margin: 6px 0 0; padding: 8px 0; background: var(--page); border: 1px solid var(--grid); border-radius: 8px; font-size: 12px; line-height: 1.5; white-space: normal; }
pre.diff span { display: block; padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
pre.diff .add { background: var(--add-bg); color: var(--add-ink); }
pre.diff .del { background: var(--del-bg); color: var(--del-ink); }
pre.diff .hunk { color: var(--muted); }
.unapplied { font-size: 12px; color: var(--ink-2); margin: 6px 0 0; }
.unapplied::before { content: "⚠"; color: var(--warning); margin-right: 6px; }
.rrows { display: grid; gap: 10px; margin-top: 10px; }
.rrow { border: 1px solid var(--grid); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.rrow h4 { margin: 0; font-size: 13px; font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.rrow p { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
.see { font-size: 12.5px; color: var(--ink-2); margin: 6px 0 0; }
.see a, .topic .why a { color: var(--s1); text-decoration: none; }
.see a:hover { text-decoration: underline; }
.topic header { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.topic h3 { margin: 0; font-size: 15px; font-weight: 600; }
.badge { font-size: 11.5px; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--ring); color: var(--ink-2); white-space: nowrap; }
.badge.yes::before { content: "●"; color: var(--s1); margin-right: 5px; }
.badge.no::before { content: "○"; color: var(--muted); margin-right: 5px; }
.topic .empty { color: var(--muted); margin: 8px 0 0; font-style: italic; }
.topic .why { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
.item { border-top: 1px solid var(--grid); margin-top: 12px; padding-top: 12px; }
.item:first-of-type { border-top: 0; margin-top: 8px; padding-top: 0; }
.item p { margin: 0 0 6px; }
.item dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 12px; margin: 6px 0 0; font-size: 13px; }
.item dt { color: var(--muted); }
.item dd { margin: 0; color: var(--ink-2); }
.conf { font-size: 11.5px; color: var(--ink-2); }
.evidence { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; }
.evidence li { color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.evidence .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); min-width: 52px; }
.evidence a { color: var(--s1); text-decoration: none; overflow-wrap: anywhere; }
.evidence a:hover { text-decoration: underline; }
.evidence code { font-size: 12px; overflow-wrap: anywhere; }
@media (max-width: 640px) { .item dl { grid-template-columns: 1fr; } .item dt { margin-top: 4px; } }
header.top { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
.meta { color: var(--ink-2); font-size: 12.5px; margin: 0; }
.meta code { font-size: 12px; }
button.theme { background: var(--surface); color: var(--ink); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
.kpis { display: grid; grid-template-columns: minmax(220px, 1.3fr) repeat(4, minmax(0, 1fr)); gap: 12px; margin: 20px 0 12px; }
.kpis .tile.hero { grid-row: span 2; display: flex; flex-direction: column; justify-content: center; }
@media (max-width: 960px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpis .tile.hero { grid-column: 1 / -1; grid-row: auto; } }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; }
.tile .label { color: var(--ink-2); font-size: 12.5px; }
.tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
.tile .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
.tile.hero .value { font-size: 48px; line-height: 1.1; }
.warn { background: var(--surface); border: 1px solid var(--ring); border-left: 4px solid var(--warning); border-radius: 10px; padding: 10px 14px; margin: 0 0 20px; color: var(--ink-2); font-size: 13px; }
.warn ul { margin: 4px 0 0; padding-left: 18px; }
.grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; padding: 18px 18px 14px; min-width: 0; }
.card h2 { font-size: 16px; margin: 0; font-weight: 600; }
.card .sub { color: var(--ink-2); margin: 2px 0 12px; font-size: 13px; }
.card .note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.panels { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.panel h3 { font-size: 13px; font-weight: 600; margin: 0 0 4px; color: var(--ink-2); }
.chart { width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 0 0; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.hatch { background: repeating-linear-gradient(45deg, var(--wait) 0 2px, transparent 2px 5px); border: 1px solid var(--wait); }
.legend i.dot { border-radius: 50%; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tiles .tile { padding: 10px 12px; }
.tiles .tile .value { font-size: 20px; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
.table-wrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 280px; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg text.ink { fill: var(--ink-2); }
svg text.strong { fill: var(--ink); font-weight: 600; }
.mark { cursor: default; }
.mark:hover, .mark:focus { opacity: .82; outline: none; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 18px rgba(0,0,0,.14); max-width: 320px; display: none; }
.tip b { font-weight: 600; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; }
.tip .row span:last-child { font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .tile.hero .value { font-size: 40px; } }
.na { margin: 4px 0 0; padding: 12px 14px; border: 1px dashed var(--axis); border-radius: 10px; color: var(--ink-2); font-size: 13px; }
.na::before { content: "∅"; color: var(--muted); margin-right: 8px; }
</style>
</head>
<body>
<div class="layout">
<nav class="side" data-aria="navAria">
  <span class="title" data-s="navTitle"></span>
  <ol id="nav-list"></ol>
  <select id="nav-select" data-aria="navSelect"></select>
</nav>
<main>
  <header class="top" id="summary">
    <div>
      <h1 id="title"></h1>
      <p class="meta" id="meta"></p>
    </div>
    <button class="theme" id="theme" type="button"></button>
  </header>
  <section class="kpis" id="kpis"></section>
  <div class="warn" id="warn"></div>
  <div class="grid">
    <section class="card" id="g1"><h2 data-s="g1"></h2><p class="sub" data-s="g1sub"></p><div class="body"><div class="panels"><div class="panel"><h3 data-s="hours"></h3><div class="chart" data-c="tasksHours"></div></div><div class="panel"><h3 data-s="tokensTotalCache"></h3><div class="chart" data-c="tasksTokens"></div></div><div class="panel"><h3 data-s="tokensUncachedLong"></h3><div class="chart" data-c="tasksUncached"></div></div></div><div class="legend" data-l="g1"></div><p class="note" data-n="g1"></p><details><summary data-s="table"></summary><div class="table-wrap" data-t="g1"></div></details></div></section>
    <section class="card" id="g2"><h2 data-s="g2"></h2><p class="sub" id="g2sub"></p><div class="body"><div class="chart" data-c="timeline"></div><div class="legend" data-l="g2"></div><h3 style="font-size:13px;margin:14px 0 4px;color:var(--ink-2);font-weight:600" data-s="concurrency"></h3><div class="chart" data-c="concurrency"></div><p class="note" data-n="g2"></p></div></section>
    <section class="card" id="g3"><h2 data-s="g3"></h2><p class="sub" data-s="g3sub"></p><div class="body"><div class="panels"><div class="panel"><h3 data-s="cumTotal"></h3><div class="chart" data-c="cumTotal"></div></div><div class="panel"><h3 data-s="cumUncached"></h3><div class="chart" data-c="cumUncached"></div></div></div><div class="legend" data-l="g3"></div><p class="note" data-n="g3"></p></div></section>
    <section class="card" id="g4"><h2 data-s="g4"></h2><p class="sub" data-s="g4sub"></p><div class="body"><div class="panels"><div class="panel"><h3 data-s="occupiedHours"></h3><div class="chart" data-c="catHours"></div></div><div class="panel"><h3 data-s="tokensTotal"></h3><div class="chart" data-c="catTokens"></div></div><div class="panel"><h3 data-s="tokensUncached"></h3><div class="chart" data-c="catUncached"></div></div></div><div class="legend" data-l="g4"></div><p class="note" data-n="g4"></p><details><summary data-s="table"></summary><div class="table-wrap" data-t="g4"></div></details></div></section>
    <section class="card" id="g5"><h2 data-s="g5"></h2><p class="sub" data-s="g5sub"></p><div class="body"><div class="tiles" data-k="g5"></div><div class="chart" data-c="cmdStrip"></div><div class="legend" data-l="g5"></div><div class="panels" style="margin-top:14px"><div class="panel"><h3 data-s="topChecks"></h3><div class="chart" data-c="cmdChecks"></div></div><div class="panel"><h3 data-s="timeByType"></h3><div class="chart" data-c="cmdTypeTime"></div></div></div><p class="note" data-n="g5"></p><details><summary data-s="tableByType"></summary><div class="table-wrap" data-t="g5"></div></details></div></section>
    <section class="card" id="g6"><h2 data-s="g6"></h2><p class="sub" data-s="g6sub"></p><div class="body"><div class="tiles" data-k="g6"></div><div class="panels"><div class="panel"><h3 data-s="classOrigin"></h3><div class="chart" data-c="findMatrix"></div><div class="legend" data-l="g6"></div></div><div class="panel"><h3 data-s="channel"></h3><div class="chart" data-c="findChannel"></div></div><div class="panel"><h3 data-s="stages"></h3><div class="chart" data-c="findStages"></div></div></div><p class="note" data-n="g6"></p><details><summary data-s="tableFindings"></summary><div class="table-wrap" data-t="g6"></div></details></div></section>
    <section class="card" id="g7"><h2 data-s="g7"></h2><p class="sub" data-s="g7sub"></p><div class="body"><div class="panels"><div class="panel"><div class="chart" data-c="rework"></div></div><div class="panel"><h3 data-s="acceptancePerTask"></h3><div class="chart" data-c="acceptance"></div></div></div><p class="note" data-n="g7"></p><details><summary data-s="table"></summary><div class="table-wrap" data-t="g7"></div></details></div></section>
    <section class="card" id="g8"><h2 data-s="g8"></h2><p class="sub" data-s="g8sub"></p><div class="body"><div class="tiles" data-k="g8"></div><div class="panels"><div class="panel"><h3 data-s="tokenAttribution"></h3><div class="chart" data-c="partition"></div><div class="legend" data-l="g8"></div></div><div class="panel"><h3 data-s="gapsByCode"></h3><div class="chart" data-c="gaps"></div></div></div><p class="note" data-n="g8"></p><details><summary data-s="qualityRecords"></summary><div class="table-wrap" data-t="g8"></div></details></div></section>
    <section class="card" id="insights"><h2 data-s="insights"></h2><p class="sub" id="ins-sub"></p><div class="ins-filter" role="group" data-aria="filterAria"></div><div class="topics" id="topics"></div></section>
    <section class="card" id="ins-no-change"><h2 data-s="noChange"></h2><p class="sub" data-s="noChangeSub"></p><div class="topics" id="no-change"></div></section>
    <section class="card" id="ins-pending"><h2 data-s="pending"></h2><p class="sub" data-s="pendingSub"></p><div class="topics" id="pending"></div></section>
  </div>
</main>
</div>
<div class="tip" id="tip" role="status"></div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script id="insights-data" type="application/json">/*__INSIGHTS__*/</script>
<script id="meta-data" type="application/json">/*__META__*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const I = JSON.parse(document.getElementById("insights-data").textContent);
const META = JSON.parse(document.getElementById("meta-data").textContent);

// ---------- strings ----------
const STRINGS = {
  en: {
    docTitle: t => `Execution · ${t}`, heading: t => `Spec execution · ${t}`,
    navAria: "Dashboard sections", navTitle: "Navigation", navSelect: "Go to section",
    theme: "Theme", themes: { auto: "auto", light: "light", dark: "dark" },
    meta: (s, start) => `Run <code>${s.run}</code> · ${s.working_tree ? "working tree at" : "commit"} <code>${s.commit}</code>${s.subject ? ` (${s.subject})` : ""} · spec-execution-metrics reader ${s.reader} · ${s.records} records · start ${start}`,
    metaNoMetrics: (s, reason) => `${s.commit ? `${s.working_tree ? "Working tree at" : "Commit"} <code>${s.commit}</code> · ` : ""}metrics unavailable: ${reason}`,
    unavailable: r => `Data unavailable: ${r}.`,
    unknownDuration: "unknown", h: "h", s: "s", min: "min",
    g1: "1 · Time and tokens per task", g1sub: "Where the cost concentrated. Occupied time = union of the task's active intervals (parallelism is not counted twice); the declared sum of spans shows as a light bar.",
    g2: "2 · Execution timeline", g2sub: span => `Where the ${span} went. Lane 1 = coordinator session; following lanes = packed subagents (each lane groups sessions that do not overlap). Colour = activity group; hatched = wait.`,
    g3: "3 · Cumulative token use over time", g3sub: "When the tokens were spent. Aggregated in 5-minute windows by each snapshot's timestamp; ticks at the top = start of each task.",
    g4: "4 · Cost per activity category", g4sub: "Which kind of work consumed time and tokens. Metrics instrumentation is highlighted as overhead of the measurement itself.",
    g5: "5 · Verification commands", g5sub: "Each dot is a command (duration on a log scale), by verification type. Below, the most repeated checks and how many runs failed.",
    g6: "6 · Findings", g6sub: "Where the errors came from: classification × origin, discovery channel and handling stages.",
    g7: "7 · Rework per task", g7sub: "Were the most expensive tasks the ones with most findings? x = occupied hours (log), y = findings, dot area = tokens. Right: acceptance markers (each = a new E2E acceptance round).",
    g8: "8 · Measurement quality", g8sub: "How much of the charts above is exact. Reader gaps, quality records and the token-attribution partition.",
    hours: "Hours", tokensTotalCache: "Total tokens (cache included)", tokensUncachedLong: "Uncached tokens (uncached input + output)",
    table: "Table", tableByType: "Table by type", tableFindings: "Findings table", qualityRecords: "Quality records",
    concurrency: "Subagents active at the same time", cumTotal: "Cumulative total tokens (stacked)", cumUncached: "Cumulative uncached tokens",
    occupiedHours: "Occupied hours", tokensTotal: "Total tokens", tokensUncached: "Uncached tokens",
    topChecks: "Most executed checks (runs)", timeByType: "Total time per verification type (h)",
    classOrigin: "Classification × origin", channel: "Discovery channel", stages: "Recorded stages",
    acceptancePerTask: "Acceptance markers per task", tokenAttribution: "Token attribution", gapsByCode: "Gaps per code",

// Stacked horizontal bars. data: {label, parts:{key:value}}

    el("text", { x: x(t), y: h - 6, "text-anchor": "middle", text: percent ? pf.format(t) : fmt(t, true) }, s);

  data.forEach((d, i) => {

// ---------- G2 ----------
function taskTicks(s, x, y, minGap = 26) {

  const starts = D.timeline.task_starts, placed = [];

  for (const [, at] of starts) el("line", { x1: x(at), x2: x(at), y1: y, y2: y + 6, stroke: v("--axis") }, s);
  for (const pass of [true, false]) {
    for (const [task, at] of starts) {

      el("text", { x: x(at), y: y - 2, "text-anchor": "middle", class: pass ? "ink" : null, text: task }, s);
      placed.push(x(at));
    }
  }
}

}

function cumChart(box, keys, stacked) {
  const Sr = D.cumulative.series, span = Math.max(D.timeline.span_seconds, Sr[Sr.length - 1].t);
  const h = 230, top = 22, bottom = 22;
  const [s, w] = svgIn(box, h);
  const x0 = 44, x1 = w - 10;
  const tot = p => keys.reduce((a, k) => a + p[k.field], 0);
  const max = niceMax(Math.max(...Sr.map(p => stacked ? tot(p) : Math.max(...keys.map(k => p[k.field])))));
  const x = lin(0, span, x0, x1), y = lin(0, max, h - bottom, top);
  timeAxis(s, x, span, top, h - bottom, w);
  for (const t of ticks(max)) { el("line", { x1: x0, x2: x1, y1: y(t), y2: y(t), stroke: v("--grid") }, s); el("text", { x: x0 - 6, y: y(t) + 4, "text-anchor": "end", text: cf.format(t) }, s); }
  taskTicks(s, x, top - 8, 30);
  let base = Sr.map(() => 0);
  keys.forEach(k => {
    const vals = Sr.map((p, i) => (stacked ? base[i] : 0) + p[k.field]);
    const line = vals.map((val, i) => `${i ? "L" : "M"}${x(Sr[i].t)},${y(val)}`).join("");
    const lower = stacked ? base.map((b, i) => `L${x(Sr[i].t)},${y(b)}`).reverse().join("") : `L${x(Sr[Sr.length - 1].t)},${y(0)}L${x(Sr[0].t)},${y(0)}`;
    el("path", { d: line + lower + "Z", style: `fill:${v(k.color)};opacity:${stacked ? .22 : .1}` }, s);
    el("path", { d: line, fill: "none", style: `stroke:${v(k.color)}`, "stroke-width": 2, "stroke-linejoin": "round" }, s);
    el("circle", { cx: x(Sr[Sr.length - 1].t), cy: y(vals[vals.length - 1]), r: 4, style: `fill:${v(k.color)};stroke:var(--surface)`, "stroke-width": 2 }, s);
    if (stacked) base = vals;
  });
  const cross = el("line", { y1: top, y2: h - bottom, style: "stroke:var(--axis);display:none" }, s);
  const ov = el("rect", { x: x0, y: top, width: x1 - x0, height: h - top - bottom, fill: "transparent" }, s);
  ov.addEventListener("pointermove", e => {
    const r = s.getBoundingClientRect(), px = (e.clientX - r.left) * (w / r.width);
    const at = (px - x0) / (x1 - x0) * span;
    const p = Sr.reduce((best, q) => Math.abs(q.t - at) < Math.abs(best.t - at) ? q : best, Sr[0]);
    cross.setAttribute("x1", x(p.t)); cross.setAttribute("x2", x(p.t)); cross.style.display = "";
    showTip(e, `<b>${esc(S.until(clock(p.t), nf.format(hours(p.t))))}</b>` + rows(keys.map(k => [k.label, cf.format(p[k.field])])) + (stacked ? rows([[S.total, cf.format(tot(p))]]) : ""));
  });
  ov.addEventListener("pointerleave", () => { cross.style.display = "none"; hideTip(); });
}

const NAV = [["summary", ""], ["g1", "1"], ["g2", "2"], ["g3", "3"], ["g4", "4"], ["g5", "5"], ["g6", "6"], ["g7", "7"], ["g8", "8"], ["insights", ""], ["ins-no-change", ""], ["ins-pending", ""]];
function renderNav() {
  const list = document.getElementById("nav-list"), select = document.getElementById("nav-select");
  list.innerHTML = NAV.map(([id, n]) => `<li><a href="#${id}" data-id="${id}"><span class="n">${n}</span><span>${esc(S.nav[id])}</span></a></li>`).join("");
  select.innerHTML = NAV.map(([id, n]) => `<option value="${id}">${n ? n + " · " : ""}${esc(S.nav[id])}</option>`).join("");
  select.addEventListener("change", () => document.getElementById(select.value).scrollIntoView({ behavior: "smooth", block: "start" }));
  const links = Object.fromEntries([...list.querySelectorAll("a")].map(a => [a.dataset.id, a]));
  const visible = new Map();
  const setActive = id => {
    for (const [key, a] of Object.entries(links)) a.setAttribute("aria-current", key === id ? "true" : "false");
    if (select.value !== id) select.value = id;
  };
  const io = new IntersectionObserver(entries => {
    for (const e of entries) visible.set(e.target.id, e.isIntersecting ? e.boundingClientRect.top : null);
    const shown = NAV.map(([id]) => id).filter(id => visible.get(id) != null);
    if (shown.length) setActive(shown[0]);
  }, { rootMargin: "-10% 0px -55% 0px" });
  for (const [id] of NAV) io.observe(document.getElementById(id));
  setActive("summary");
}

// ---------- insights ----------
function fmtValue(path, val) {
  if (val == null) return S.unknown;
  if (typeof val === "boolean") return val ? S.yes : S.no;
  if (typeof val === "number") {
    if (/seconds$/.test(path)) return `${fh(val)} (${nf0.format(val)} ${S.s})`;
    if (/tokens|\.total$/.test(path) && val >= 1e5) return `${cf.format(val)} (${nf0.format(val)})`;
    return nf.format(val);
  }
  if (typeof val === "string") return /^\d{4}-\d{2}-\d{2}T/.test(val) ? new Date(val).toLocaleString(LANG) : val;
  if (Array.isArray(val)) return val.map(o => typeof o === "object" && o ? Object.values(o).slice(0, 3).join(" · ") : o).join("; ");
  return Object.entries(val).map(([k, x]) => `${k}: ${typeof x === "object" ? JSON.stringify(x) : (typeof x === "number" ? nf.format(x) : x)}`).join(", ");
}
const where = (root, path, line) => `${root && root !== "project" ? root + ":" : ""}${path}${line ? ":" + line : ""}`;
function evidenceHtml(e) {
  const read = e.reading ? ` · <i>${esc(S.readingProof)}</i>` : "";
  if (e.kind === "file") {
    const root = e.root || "project", text = esc(where(root, e.path, e.line));
    const ref = root === "project" && META.link_base ? `<a href="${esc(META.link_base + e.path.split("/").map(encodeURIComponent).join("/"))}" title="${esc(e.excerpt)}">${text}</a>` : `<code title="${esc(e.excerpt)}">${text}</code>`;
    return `<span class="k">${esc(S.kFile)}</span><span>${esc(e.label)}: ${ref}${read}</span>`;
  }
  if (e.kind === "git") {
    const same = e.same_as ? ` · <span title="${esc(where(e.same_as.root || "project", e.same_as.path))}">${esc(S.sameCopy)}</span>` : "";
    return `<span class="k">${esc(S.kGit)}</span><span>${esc(e.label)}: <code title="${esc(e.excerpt)}">${esc(where(e.repo, `${e.rev}:${e.path}`, e.line))}</code>${same}</span>`;
  }
  if (e.kind === "data") return `<span class="k">${esc(S.kData)}</span><span>${esc(e.label)}: <b>${esc(fmtValue(e.path, e.value))}</b>${read}</span>`;
  const f = e.finding || {};
  return `<span class="k">${esc(S.kFinding)}</span><span><code>${esc(e.label)}</code> · ${esc(f.task)} · ${esc(f.classification)} · ${esc(f.origin)}</span>`;
}
const evList = list => list && list.length ? `<ul class="evidence">${list.map(e => `<li>${evidenceHtml(e)}</li>`).join("")}</ul>` : "";
const isPrio = it => !!(it.priority && it.priority.selected);
const recKind = k => S.rec[k] || k;
const refTitle = ref => {
  const [section, id] = ref.split(":");
  const entry = (I[section] || []).find(x => x.id === id);
  return `<a href="#${section === "pending" ? "pd" : "nc"}-${esc(id)}">${esc(entry ? entry.title : id)}</a> (${esc(section === "pending" ? S.refPending : S.refNoChange)})`;
};
function diffHtml(text) {
  return text.split("\n").map(line => {
    const cls = line.startsWith("@@") ? "hunk" : line.startsWith("+") ? "add" : line.startsWith("-") ? "del" : "";
    return `<span${cls ? ` class="${cls}"` : ""}>${esc(line) || " "}</span>`;
  }).join("");
}
function itemHtml(it) {
  const tags = [`<span class="tag">${esc(S.change[it.change_kind] || it.change_kind)}</span>`];
  if (it.destination) tags.push(`<span class="tag">${esc(S.destTag)}: <b>${esc(S.dest[it.destination] || it.destination)}</b></span>`);
  if (it.guidance) tags.push(`<span class="tag">${esc(S.guidanceTag)}: <b>${esc(S.state[it.guidance.state] || it.guidance.state)}</b></span>`);
  const patterns = it.recurrence && it.recurrence.patterns && it.recurrence.patterns.length ? it.recurrence.patterns.join(", ") : "";
  if (it.recurrence) tags.push(`<span class="tag">${esc(recKind(it.recurrence.kind))}${patterns ? " · " + esc(patterns) : ""}</span>`);
  const blocks = [];
  if (it.guidance) {
    const g = it.guidance;
    blocks.push(`<details class="blk"><summary>${esc(S.guidanceBlock)}</summary><p><b>${esc(S.state[g.state] || g.state)}.</b> ${esc(g.summary)}</p><p>${esc(S.version)}: ${esc(g.version)}</p>${g.unrecoverable ? `<p>${esc(S.unrecoverable)}: ${esc(g.unrecoverable)}</p>` : ""}${evList(g.evidence)}</details>`);
  }
  if (it.alternatives) {
    blocks.push(`<details class="blk"><summary>${esc(S.alternatives)}</summary><ul class="alts">${it.alternatives.map(a => `<li class="${a.recommended ? "rec" : ""}"><div class="opt">${esc(S.option[a.option] || a.option)}${a.recommended ? `<em>${esc(S.recommended)}</em>` : ""}</div><dl><dt>${esc(S.loses)}</dt><dd>${esc(a.loses)}</dd><dt>${esc(S.judgment)}</dt><dd>${esc(a.judgment)}</dd></dl></li>`).join("")}</ul></details>`);
  }
  if (it.evaluation) {
    blocks.push(`<details class="blk"><summary>${esc(S.evaluation)}</summary><dl>${Object.entries(S.evalLabels).map(([k, l]) => `<dt>${esc(l)}</dt><dd>${esc(it.evaluation[k])}</dd>`).join("")}</dl></details>`);
  }
  if (it.proposed_text) {
    const p = it.proposed_text, base = p.base || {};
    blocks.push(`<details class="blk"><summary>${esc(S.proposed(p.format))}</summary><p class="unapplied">${esc(S.unapplied(p.target, where(base.repo, `${base.rev}:${base.path}`)))}</p><pre class="diff">${diffHtml(p.text)}</pre></details>`);
  }
  if (it.recurrence) {
    blocks.push(`<details class="blk"><summary>${esc(S.recurrenceBlock)}</summary><p>${esc(recKind(it.recurrence.kind))}${patterns ? ` · ${esc(S.patterns)} ${esc(patterns)}` : ""}</p>${evList(it.recurrence.evidence)}</details>`);
  }
  if (it.recurrence_table) {
    blocks.push(`<div class="rrows">${it.recurrence_table.map(r => `<div class="rrow"><h4>${esc(r.pattern)} · ${esc(r.title)} <span class="tag">${esc(recKind(r.kind))}</span></h4><p>${esc(r.note)}</p>${evList(r.evidence)}</div>`).join("")}</div>`);
  }
  const prio = it.priority ? `<dt>${esc(S.priority)}</dt><dd>${isPrio(it) ? `<b>${esc(S.priorityTag)}</b> — ` : ""}${esc(it.priority.rationale)}</dd>` : "";
  return `<div class="item"><div class="tags">${tags.join("")}</div><p>${esc(it.insight)}</p><dl><dt>${esc(S.impact)}</dt><dd>${esc(it.impact)}</dd><dt>${esc(S.recommendation)}</dt><dd>${esc(it.recommendation)}</dd><dt>${esc(S.confidence)}</dt><dd class="conf">${esc(S.conf[it.confidence] || it.confidence)}</dd>${prio}</dl>${evList(it.evidence)}${blocks.join("")}</div>`;
}
function renderInsights(filter = "all") {
  if (!I) {
    document.getElementById("ins-sub").textContent = S.notGenerated;
    for (const id of ["no-change", "pending"]) document.getElementById(id).innerHTML = `<p class="na">${esc(S.none)}</p>`;
    return;
  }
  const T = I.topics, withIns = T.filter(t => t.status === "insight").length;
  const prioCount = T.reduce((n, t) => n + (t.items || []).filter(isPrio).length, 0);
  const NC = I.no_change || [], PD = I.pending || [];
  document.getElementById("ins-sub").textContent = `${S.insSub(T.length, withIns, prioCount, NC.length, PD.length)} ${I.scope || ""}`;
  const box = document.querySelector(".ins-filter");
  box.innerHTML = [["all", S.fAll(T.length)], ["insight", S.fInsight(withIns)], ["none", S.fNone(T.length - withIns)], ["priority", S.fPriority(prioCount)]]
    .map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${k === filter}">${esc(l)}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.addEventListener("click", () => renderInsights(b.dataset.f)));
  const shown = T.filter(t => filter === "all" || (filter === "priority" ? (t.items || []).some(isPrio) : t.status === filter));
  document.getElementById("topics").innerHTML = shown.map(t => {
    const items = (t.items || []).filter(it => filter !== "priority" || isPrio(it));
    const n = (t.items || []).length, p = (t.items || []).filter(isPrio).length;
    const badges = `<span class="badges">${p ? `<span class="badge prio">${esc(S.badgePrio(p))}</span>` : ""}<span class="badge ${t.status === "insight" ? "yes" : "no"}">${esc(t.status === "insight" ? S.badgeIns(n) : S.badgeNone)}</span></span>`;
    const head = `<header><h3>${T.indexOf(t) + 1}. ${esc(t.title)}</h3>${badges}</header>`;
    const see = t.see && t.see.length ? `<p class="see">${esc(S.see)}: ${t.see.map(refTitle).join("; ")}</p>` : "";
    if (t.status !== "insight") return `<article class="topic">${head}<p class="empty">${esc(S.noInsight)}</p>${t.note ? `<p class="why">${esc(t.note)}</p>` : ""}${see}</article>`;
    return `<article class="topic">${head}${items.map(itemHtml).join("")}${filter === "priority" ? "" : see}</article>`;
  }).join("");
  document.getElementById("no-change").innerHTML = NC.length ? NC.map(x => `<article class="topic" id="nc-${esc(x.id)}"><header><h3>${esc(x.title)}</h3><span class="badge no">${esc(S.badgeNoChange)}</span></header><div class="item"><p>${esc(x.reason)}</p>${evList(x.evidence)}</div></article>`).join("") : `<p class="na">${esc(S.none)}</p>`;
  document.getElementById("pending").innerHTML = PD.length ? PD.map(x => `<article class="topic" id="pd-${esc(x.id)}"><header><h3>${esc(x.title)}</h3><span class="badge no">${esc(S.badgePending)}</span></header><div class="item"><dl><dt>${esc(S.gap)}</dt><dd>${esc(x.gap)}</dd><dt>${esc(S.decideWith)}</dt><dd>${esc(x.decide_with)}</dd></dl>${evList(x.evidence)}</div></article>`).join("") : `<p class="na">${esc(S.none)}</p>`;
}

// ---------- theme & render ----------
const themes = ["auto", "light", "dark"];
let theme = "auto";
try { theme = localStorage.getItem("insight-dashboard-theme") || "auto"; } catch (e) {}
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme").textContent = `${S.theme}: ${S.themes[theme]}`;
}
document.getElementById("theme").addEventListener("click", () => {
  theme = themes[(themes.indexOf(theme) + 1) % themes.length];
  try { localStorage.setItem("insight-dashboard-theme", theme); } catch (e) {}
  applyTheme();
});
renderStatic();
applyTheme();
function renderAll() { renderTasks(); renderTimeline(); renderCumulative(); renderCategories(); renderCommands(); renderFindings(); renderRework(); renderQuality(); }
renderHeader();
renderAll();
renderNav();
renderInsights();
let lastW = innerWidth, pendingResize;
addEventListener("resize", () => { if (innerWidth === lastW || !metricsOn) return; lastW = innerWidth; clearTimeout(pendingResize); pendingResize = setTimeout(renderAll, 120); });
</script>
</body>
</html>
